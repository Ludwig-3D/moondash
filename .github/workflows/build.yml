name: Build

on:
  push:
    branches: [main, master, dev, develop, rust-native]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets

  package:
    name: Package Debian ${{ matrix.suite }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: bookworm, arch: amd64, image: 'debian:12', platform: linux/amd64, runner: [self-hosted, linux, x64]}
          - {suite: trixie, arch: amd64, image: 'debian:13', platform: linux/amd64, runner: [self-hosted, linux, x64]}
          - {suite: bookworm, arch: arm64, image: 'debian:12', platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {suite: trixie, arch: arm64, image: 'debian:13', platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {suite: bookworm, arch: armhf, image: 'arm32v7/debian:12', platform: linux/arm/v7, runner: ubuntu-24.04-arm}
          - {suite: trixie, arch: armhf, image: 'arm32v7/debian:13', platform: linux/arm/v7, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armhf'
        with:
          platforms: arm
      - name: Build and package the native binary
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_SUITE: ${{ matrix.suite }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "$BUILD_PLATFORM" \
            -e BUILD_SUITE -e BUILD_ARCH -v "$PWD:/work" -w /work "$BUILD_IMAGE" sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl build-essential pkg-config libfontconfig1-dev
              test "$(dpkg --print-architecture)" = "$BUILD_ARCH"
              curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal
              . "$HOME/.cargo/env"
              export CARGO_BUILD_JOBS=4
              case "$BUILD_ARCH" in armhf) CARGO_BUILD_JOBS=2;; esac
              cargo build --locked --release
              scripts/package-deb.sh target/release/moondash dist-artifacts "$BUILD_SUITE"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: moondash-${{ matrix.suite }}-${{ matrix.arch }}
          path: dist-artifacts/*
          if-no-files-found: error
