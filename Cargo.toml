[package]
name = "moondash"
version = "0.0.11"
description = "Modern Klipper touch interface"
authors = ["tludwigdev"]
edition = "2024"
license = "MIT"

[dependencies]
evdev = "0.13"
futures-util = { version = "0.3", features = ["sink"] }
get_if_addrs = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
nmrs = "2.2"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.19.0", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "unstable-winit-030",
    "renderer-femtovg", "renderer-femtovg-wgpu", "renderer-software",
    "software-renderer-path",
] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[build-dependencies]
slint-build = "=1.19.0"

# Keep live webcam decoding responsive in development builds.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 3
